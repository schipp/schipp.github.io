name: Refresh counts

on:
  push:
    paths:
      - 'index.html'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-counts

jobs:
  refresh:
    # skip pushes made by this workflow itself (bot commits of refreshed counts)
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh citation and star counts
        run: python3 update_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh citation and star counts"
            git push
          else
            echo "Counts unchanged"
          fi
